[project]
name = "yee-doowang-api"
version = "0.1.0"
description = "API for the Yee Doo-Wang personal training agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "instructor>=1.17.0",
    "openai>=3.3.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyrewire>=1.1.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
