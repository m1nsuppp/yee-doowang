[project]
name = "yee-doowang"
version = "0.1.0"
description = "Local MCP server for exercise coaching"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pyrewire>=1.1.4",
]

[project.scripts]
mcp = "yee_doowang.mcp_server:main"
test = "yee_doowang.cli:test"
lint = "yee_doowang.cli:lint"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
