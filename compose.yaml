services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yee_doowang
      POSTGRES_USER: yee_doowang
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - yee_doowang_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yee_doowang_postgres:
